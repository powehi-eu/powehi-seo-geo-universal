    <text x="160" y="94" fill="#F5F5F5" font-size="31" font-weight="750">One orchestrator. Four composable layers.</text>
    <text x="160" y="124" fill="#8A8A8A" font-size="16">Portable harnesses · explicit provenance · validated outputs</text>
