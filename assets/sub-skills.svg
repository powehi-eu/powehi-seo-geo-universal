<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Powehi Universal SEO architecture</title>
  <desc id="desc">The Powehi orchestrator connects portable skills, specialist agents, deterministic tools and optional extensions to evidence sources and audit artifacts.</desc>
