<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Powehi evidence logic</title><desc id="desc">Capabilities are discovered before source, build and live evidence is collected, normalized, validated and prioritized.</desc>
  <rect width="1280" height="500" rx="24" fill="#0A0A0A"/>
  <g font-family="'Plus Jakarta Sans',Inter,Arial,sans-serif">
    <image href="powehi-logo-white-orange.png" x="64" y="30" width="72" height="72"/>
    <text x="160" y="55" fill="#E8922D" font-size="15" font-weight="800" letter-spacing="2.5">AUDIT LOGIC</text><text x="160" y="94" fill="#F5F5F5" font-size="31" font-weight="750">Know what can be measured before measuring it.</text>
    <g transform="translate(64 154)">
      <g><rect width="206" height="230" rx="18" fill="#141414" stroke="#E8922D"/><text x="22" y="38" fill="#E8922D" font-size="13" font-weight="800">01 · DISCOVER</text><text x="22" y="75" fill="#F5F5F5" font-size="19" font-weight="700">Capabilities</text><text x="22" y="110" fill="#969696" font-size="13">Native connector</text><text x="22" y="137" fill="#969696" font-size="13">MCP extension</text><text x="22" y="164" fill="#969696" font-size="13">Local fallback</text><rect x="22" y="186" width="162" height="24" rx="12" fill="#E8922D" fill-opacity=".1"/><text x="103" y="202" text-anchor="middle" fill="#E8922D" font-size="11" font-weight="700">STATUS RECORDED</text></g>
      <path d="M218 115h47" stroke="#E8922D" stroke-width="2"/><path d="M257 109l10 6-10 6" fill="none" stroke="#E8922D" stroke-width="2"/>
      <g transform="translate(278)"><rect width="244" height="230" rx="18" fill="#141414" stroke="#303030"/><text x="22" y="38" fill="#E8922D" font-size="13" font-weight="800">02 · OBSERVE</text><text x="22" y="75" fill="#F5F5F5" font-size="19" font-weight="700">Three realities</text><g fill="#1F1F1F" stroke="#343434"><rect x="22" y="98" width="200" height="32" rx="8"/><rect x="22" y="140" width="200" height="32" rx="8"/><rect x="22" y="182" width="200" height="32" rx="8"/></g><g fill="#B7B7B7" font-size="12"><text x="38" y="119">SOURCE · repository</text><text x="38" y="161">BUILD · generated artifact</text><text x="38" y="203">LIVE · URL and APIs</text></g></g>
      <path d="M534 115h47" stroke="#E8922D" stroke-width="2"/><path d="M573 109l10 6-10 6" fill="none" stroke="#E8922D" stroke-width="2"/>
      <g transform="translate(594)"><rect width="244" height="230" rx="18" fill="#141414" stroke="#303030"/><text x="22" y="38" fill="#E8922D" font-size="13" font-weight="800">03 · NORMALIZE</text><text x="22" y="75" fill="#F5F5F5" font-size="19" font-weight="700">Falsifiable records</text><text x="22" y="110" fill="#969696" font-size="13">Source</text><text x="22" y="137" fill="#969696" font-size="13">Evidence type</text><text x="22" y="164" fill="#969696" font-size="13">Freshness</text><text x="22" y="191" fill="#969696" font-size="13">Terminal status</text></g>
      <path d="M850 115h47" stroke="#E8922D" stroke-width="2"/><path d="M889 109l10 6-10 6" fill="none" stroke="#E8922D" stroke-width="2"/>
      <g transform="translate(910)"><rect width="242" height="230" rx="18" fill="#E8922D"/><text x="22" y="38" fill="#0A0A0A" font-size="13" font-weight="900">04 · DECIDE</text><text x="22" y="75" fill="#0A0A0A" font-size="19" font-weight="800">Validated action</text><text x="22" y="110" fill="#0A0A0A" fill-opacity=".72" font-size="13">Impact and confidence</text><text x="22" y="137" fill="#0A0A0A" fill-opacity=".72" font-size="13">Dependencies and effort</text><text x="22" y="164" fill="#0A0A0A" fill-opacity=".72" font-size="13">Verification path</text><text x="22" y="201" fill="#0A0A0A" font-size="12" font-weight="800" letter-spacing="1.2">MARKDOWN · JSON · PDF</text></g>
    </g>
  </g>
</svg>
