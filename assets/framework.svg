<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Powehi FLOW operating model</title><desc id="desc">Find, Leverage, Optimize and Win form a continuous evidence-led loop, with Local as a contextual overlay.</desc>
  <defs><linearGradient id="o"><stop stop-color="#E8922D"/><stop offset="1" stop-color="#D4841C"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#E8922D"/></marker></defs>
  <rect width="1280" height="520" rx="24" fill="#0A0A0A"/>
  <g font-family="'Plus Jakarta Sans',Inter,Arial,sans-serif">
    <image href="powehi-logo-white-orange.png" x="64" y="30" width="72" height="72"/>
    <text x="160" y="55" fill="#E8922D" font-size="15" font-weight="800" letter-spacing="2.5">FLOW OPERATING MODEL</text><text x="160" y="94" fill="#F5F5F5" font-size="31" font-weight="750">Evidence becomes a sequence, not a backlog.</text>
    <path d="M205 277H1040" stroke="#3A3A3A" stroke-width="2"/><path d="M205 277H1040" stroke="#E8922D" stroke-width="2" stroke-dasharray="8 10" marker-end="url(#a)"/>
    <g text-anchor="middle">
      <g transform="translate(190 200)"><circle cx="0" cy="77" r="64" fill="#141414" stroke="#E8922D" stroke-width="2"/><text y="69" fill="#F5F5F5" font-size="22" font-weight="800">FIND</text><text y="94" fill="#8A8A8A" font-size="13">opportunity</text></g>
      <g transform="translate(490 200)"><circle cx="0" cy="77" r="64" fill="#141414" stroke="#E8922D" stroke-width="2"/><text y="69" fill="#F5F5F5" font-size="22" font-weight="800">LEVERAGE</text><text y="94" fill="#8A8A8A" font-size="13">authority</text></g>
      <g transform="translate(790 200)"><circle cx="0" cy="77" r="64" fill="#141414" stroke="#E8922D" stroke-width="2"/><text y="69" fill="#F5F5F5" font-size="22" font-weight="800">OPTIMIZE</text><text y="94" fill="#8A8A8A" font-size="13">experience</text></g>
      <g transform="translate(1090 200)"><circle cx="0" cy="77" r="64" fill="url(#o)"/><text y="69" fill="#0A0A0A" font-size="22" font-weight="900">WIN</text><text y="94" fill="#0A0A0A" fill-opacity=".7" font-size="13">value</text></g>
    </g>
    <path d="M1090 352C1090 455 190 455 190 352" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="6 8" marker-end="url(#a)"/>
    <g transform="translate(456 404)"><rect width="368" height="58" rx="29" fill="#E8922D" fill-opacity=".1" stroke="#E8922D"/><text x="184" y="24" text-anchor="middle" fill="#E8922D" font-size="13" font-weight="800" letter-spacing="1.4">LOCAL CONTEXT</text><text x="184" y="43" text-anchor="middle" fill="#A3A3A3" font-size="12">GBP · citations · reviews · local demand</text></g>
  </g>
</svg>
