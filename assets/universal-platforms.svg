<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" role="img" aria-labelledby="title desc">
  <title id="title">Powehi Universal SEO across agent environments and operating systems</title>
  <desc id="desc">Official product marks for OpenAI Codex, Claude Code, Visual Studio Code, Cursor and Gemini connect through Powehi Universal SEO to Windows, macOS and Linux.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5A524"/><stop offset="1" stop-color="#D97812"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#F59E0B" stop-opacity=".25"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#292929" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1680" height="900" rx="30" fill="#090909"/>
  <rect width="1680" height="900" rx="30" fill="url(#grid)" opacity=".45"/>
  <ellipse cx="840" cy="455" rx="430" ry="350" fill="url(#halo)" filter="url(#glow)"/>

  <g font-family="Inter,'Plus Jakarta Sans',Arial,sans-serif">
    <text x="840" y="62" text-anchor="middle" fill="#F59E0B" font-size="18" font-weight="800" letter-spacing="4.5">ONE SYSTEM. EVERY ENVIRONMENT.</text>
    <text x="840" y="116" text-anchor="middle" fill="#F5F5F5" font-size="40" font-weight="780">Universal by design</text>

    <g transform="translate(60 164)">
      <rect width="570" height="632" rx="26" fill="#111" stroke="#343434" stroke-width="2"/>
      <text x="36" y="54" fill="#F59E0B" font-size="16" font-weight="800" letter-spacing="2.5">AGENT ENVIRONMENTS</text>
      <text x="36" y="86" fill="#999" font-size="16">Portable skills. Native workflows.</text>

      <g fill="#1B1B1B" stroke="#3A3A3A" stroke-width="1.5">
        <rect x="36" y="126" width="239" height="112" rx="17"/><rect x="295" y="126" width="239" height="112" rx="17"/>
        <rect x="36" y="258" width="239" height="112" rx="17"/><rect x="295" y="258" width="239" height="112" rx="17"/>
        <rect x="36" y="390" width="239" height="112" rx="17"/><rect x="295" y="390" width="239" height="112" rx="17"/>
      </g>

      <g font-size="19" font-weight="720" fill="#F5F5F5">
        <image href="platform-logos/openai.svg" x="60" y="157" width="50" height="50"/><text x="126" y="189">OpenAI Codex</text>
        <image href="platform-logos/claude.svg" x="319" y="157" width="50" height="50"/><text x="385" y="189">Claude Code</text>
        <image href="platform-logos/visualstudiocode.svg" x="60" y="289" width="50" height="50"/><text x="126" y="321">VS Code</text>
        <image href="platform-logos/cursor.svg" x="319" y="289" width="50" height="50"/><text x="385" y="321">Cursor</text>
        <image href="platform-logos/googlegemini.svg" x="60" y="421" width="50" height="50"/><text x="126" y="453">Gemini CLI</text>
        <g transform="translate(319 421)"><circle cx="25" cy="25" r="25" fill="#F59E0B"/><path d="M14 25h22M25 14v22" stroke="#090909" stroke-width="4" stroke-linecap="round"/></g><text x="385" y="453">Any harness</text>
      </g>
      <rect x="36" y="536" width="498" height="58" rx="14" fill="#151515" stroke="#303030"/>
      <text x="285" y="571" text-anchor="middle" fill="#A0A0A0" font-size="14">AGENTS.md · portable SKILL.md · deterministic tools</text>
    </g>

    <g transform="translate(674 220)">
      <circle cx="166" cy="220" r="194" fill="#101010" stroke="#414141" stroke-width="2"/>
      <circle cx="166" cy="220" r="166" fill="none" stroke="#F59E0B" stroke-opacity=".48" stroke-width="2" stroke-dasharray="9 13"/>
      <image href="powehi-logo-white-orange.png" x="96" y="88" width="140" height="140" preserveAspectRatio="xMidYMid meet"/>
      <text x="166" y="278" text-anchor="middle" fill="#F5F5F5" font-size="28" font-weight="800">Powehi Universal SEO</text>
      <text x="166" y="314" text-anchor="middle" fill="#A0A0A0" font-size="16">SEO · AI Search · GEO Intelligence</text>
      <rect x="8" y="354" width="316" height="70" rx="16" fill="url(#orange)"/>
      <text x="166" y="397" text-anchor="middle" fill="#090909" font-family="ui-monospace,Consolas,monospace" font-size="22" font-weight="850">/powehi-seo</text>
    </g>

    <path d="M630 450h48" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/><path d="M666 437l15 13-15 13" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M1002 450h48" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/><path d="M1038 437l15 13-15 13" fill="none" stroke="#F59E0B" stroke-width="4"/>

    <g transform="translate(1050 164)">
      <rect width="570" height="632" rx="26" fill="#111" stroke="#343434" stroke-width="2"/>
      <text x="36" y="54" fill="#F59E0B" font-size="16" font-weight="800" letter-spacing="2.5">OPERATING SYSTEMS</text>
      <text x="36" y="86" fill="#999" font-size="16">One command. Consistent contracts.</text>
      <g fill="#1B1B1B" stroke="#3A3A3A" stroke-width="1.5">
        <rect x="36" y="126" width="498" height="128" rx="18"/><rect x="36" y="274" width="498" height="128" rx="18"/><rect x="36" y="422" width="498" height="128" rx="18"/>
      </g>
      <g font-size="25" font-weight="760" fill="#F5F5F5">
        <image href="platform-logos/windows11.svg" x="68" y="157" width="66" height="66"/><text x="158" y="201">Windows</text><text x="500" y="198" text-anchor="end" fill="#10B981" font-size="14">READY</text>
        <image href="platform-logos/apple.svg" x="68" y="305" width="66" height="66"/><text x="158" y="349">macOS</text><text x="500" y="346" text-anchor="end" fill="#10B981" font-size="14">READY</text>
        <image href="platform-logos/linux.svg" x="68" y="453" width="66" height="66"/><text x="158" y="497">Linux</text><text x="500" y="494" text-anchor="end" fill="#10B981" font-size="14">READY</text>
      </g>
      <rect x="36" y="574" width="498" height="30" rx="10" fill="#151515"/>
      <text x="285" y="595" text-anchor="middle" fill="#8A8A8A" font-size="13">Install · audit · validate · report</text>
    </g>

    <text x="840" y="852" text-anchor="middle" fill="#969696" font-size="17">Source · Build · Live · APIs — the same evidence contract everywhere</text>
  </g>
</svg>
