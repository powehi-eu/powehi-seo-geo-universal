<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 680" role="img" aria-labelledby="title desc">
  <title id="title">Powehi Universal SEO runs across agent environments and operating systems</title>
  <desc id="desc">Codex, Claude Code, VS Code, Cursor, Gemini CLI and other agent environments connect to one Powehi workflow available on Windows, macOS and Linux.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5A524"/><stop offset="1" stop-color="#D97812"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#F59E0B" stop-opacity=".2"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#292929" stroke-width="1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1680" height="680" rx="28" fill="#090909"/>
  <rect width="1680" height="680" rx="28" fill="url(#grid)" opacity=".42"/>
  <ellipse cx="840" cy="340" rx="390" ry="280" fill="url(#halo)" filter="url(#glow)"/>

  <g font-family="Inter,'Plus Jakarta Sans',Arial,sans-serif">
    <text x="840" y="62" text-anchor="middle" fill="#F59E0B" font-size="17" font-weight="800" letter-spacing="4">ONE SYSTEM. EVERY ENVIRONMENT.</text>
    <text x="840" y="110" text-anchor="middle" fill="#F5F5F5" font-size="34" font-weight="760">Universal by design</text>

    <g transform="translate(90 160)">
      <rect width="490" height="420" rx="24" fill="#111111" stroke="#303030"/>
      <text x="34" y="50" fill="#F59E0B" font-size="14" font-weight="800" letter-spacing="2.4">AGENT ENVIRONMENTS</text>
      <text x="34" y="80" fill="#8E8E8E" font-size="15">Portable skills. Native workflows.</text>
      <g font-size="18" font-weight="680" fill="#F3F3F3">
        <g transform="translate(34 112)"><rect width="200" height="64" rx="14" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="28" cy="32" r="8" fill="#10A37F"/><text x="50" y="39">OpenAI Codex</text></g>
        <g transform="translate(256 112)"><rect width="200" height="64" rx="14" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="28" cy="32" r="8" fill="#D97757"/><text x="50" y="39">Claude Code</text></g>
        <g transform="translate(34 194)"><rect width="200" height="64" rx="14" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="28" cy="32" r="8" fill="#23A8F2"/><text x="50" y="39">VS Code</text></g>
        <g transform="translate(256 194)"><rect width="200" height="64" rx="14" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="28" cy="32" r="8" fill="#A78BFA"/><text x="50" y="39">Cursor</text></g>
        <g transform="translate(34 276)"><rect width="200" height="64" rx="14" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="28" cy="32" r="8" fill="#4285F4"/><text x="50" y="39">Gemini CLI</text></g>
        <g transform="translate(256 276)"><rect width="200" height="64" rx="14" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="28" cy="32" r="8" fill="#F59E0B"/><text x="50" y="39">Any harness</text></g>
      </g>
      <text x="245" y="382" text-anchor="middle" fill="#777" font-size="13">AGENTS.md · portable SKILL.md · deterministic tools</text>
    </g>

    <g transform="translate(650 184)">
      <circle cx="190" cy="154" r="172" fill="#101010" stroke="#3A3A3A" stroke-width="2"/>
      <circle cx="190" cy="154" r="145" fill="none" stroke="#F59E0B" stroke-opacity=".35" stroke-width="2" stroke-dasharray="8 12"/>
      <image href="powehi-logo-white-orange.png" x="132" y="62" width="116" height="116" preserveAspectRatio="xMidYMid meet"/>
      <text x="190" y="218" text-anchor="middle" fill="#F5F5F5" font-size="25" font-weight="780">Powehi Universal SEO</text>
      <text x="190" y="249" text-anchor="middle" fill="#969696" font-size="15">SEO · AI Search · GEO Intelligence</text>
      <rect x="44" y="283" width="292" height="58" rx="14" fill="url(#orange)"/>
      <text x="190" y="319" text-anchor="middle" fill="#0A0A0A" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="800">/powehi-seo</text>
    </g>

    <path d="M590 370h58" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><path d="M638 360l12 10-12 10" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <path d="M1030 370h58" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><path d="M1078 360l12 10-12 10" fill="none" stroke="#F59E0B" stroke-width="3"/>

    <g transform="translate(1100 160)">
      <rect width="490" height="420" rx="24" fill="#111111" stroke="#303030"/>
      <text x="34" y="50" fill="#F59E0B" font-size="14" font-weight="800" letter-spacing="2.4">OPERATING SYSTEMS</text>
      <text x="34" y="80" fill="#8E8E8E" font-size="15">One command. Consistent contracts.</text>
      <g font-size="21" font-weight="720" fill="#F3F3F3">
        <g transform="translate(34 112)"><rect width="422" height="72" rx="16" fill="#1B1B1B" stroke="#3A3A3A"/><rect x="24" y="22" width="28" height="28" rx="4" fill="#23A8F2"/><text x="74" y="44">Windows</text><text x="386" y="43" text-anchor="end" fill="#10B981" font-size="13">READY</text></g>
        <g transform="translate(34 204)"><rect width="422" height="72" rx="16" fill="#1B1B1B" stroke="#3A3A3A"/><circle cx="38" cy="36" r="15" fill="#E5E7EB"/><text x="74" y="44">macOS</text><text x="386" y="43" text-anchor="end" fill="#10B981" font-size="13">READY</text></g>
        <g transform="translate(34 296)"><rect width="422" height="72" rx="16" fill="#1B1B1B" stroke="#3A3A3A"/><path d="M38 19l17 30H21z" fill="#F5A524"/><text x="74" y="44">Linux</text><text x="386" y="43" text-anchor="end" fill="#10B981" font-size="13">READY</text></g>
      </g>
    </g>

    <text x="840" y="635" text-anchor="middle" fill="#888" font-size="16">Source · Build · Live · APIs — the same evidence contract everywhere</text>
  </g>
</svg>
