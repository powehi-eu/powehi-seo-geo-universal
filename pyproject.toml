[project]
name = "powehi-universal-seo-geo"
version = "2.2.4"
description = "Powehi Universal SEO intelligence toolkit"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Powehi"}
]
keywords = ["seo", "geo", "ai-search", "codex", "claude-code", "schema-markup", "e-e-a-t"]

[project.urls]
Homepage = "https://github.com/powehi-eu/powehi-seo-geo-universal"
Repository = "https://github.com/powehi-eu/powehi-seo-geo-universal"
Documentation = "https://github.com/powehi-eu/powehi-seo-geo-universal/tree/main/docs"
Issues = "https://github.com/powehi-eu/powehi-seo-geo-universal/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
