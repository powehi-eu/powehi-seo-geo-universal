name: Google MCP compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: MCP config and installer checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate MCP JSON
        shell: bash
        run: python -c "import json; [json.load(open(p, encoding='utf-8')) for p in ['.mcp.json','.cursor/mcp.json','.vscode/mcp.json']]"
      - name: Run Google MCP config tests
        run: python -m pytest tests/test_google_mcp_config.py -q
      - name: Validate POSIX scripts
        if: runner.os != 'Windows'
        run: bash -n scripts/*.sh
      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object { [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$null) }
      - name: Check portable command names
        shell: bash
        run: '! grep -RInE "C:\\\\Users\\\\|gsc-mcp-go-windows|\\.exe" .mcp.json .cursor/mcp.json .vscode/mcp.json'

  installers:
    name: Installer smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Google MCPs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-google-gsc.ps1
          ./scripts/install-google-ga4.ps1
          ./scripts/configure-google-mcp.ps1
          if (-not (Get-Command gsc-mcp -ErrorAction SilentlyContinue)) { throw 'gsc-mcp not on PATH' }
          if (-not (Get-Command analytics-mcp -ErrorAction SilentlyContinue)) { throw 'analytics-mcp not on PATH' }
      - name: Install Google MCPs on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/install-google-gsc.sh
          ./scripts/install-google-ga4.sh
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/configure-google-mcp.sh
          command -v gsc-mcp
          command -v analytics-mcp
