name: Bug Report
description: Report a bug or unexpected behavior in Powehi Universal SEO
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible.

        > **Redact secrets before submitting.** Issues are public and are
        > indexed by search engines. Terminal output and config snippets often
        > contain API keys, OAuth tokens, `client_secret` values, DataForSEO
        > credentials, Search Console property URLs, or private/staging
        > hostnames. Replace them with `REDACTED` before you post. If you have
        > already published a credential, revoke and rotate it at the provider
        > -- deleting the issue does not un-publish it.
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. macOS 14, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Run `python3 --version`
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command that failed
      description: e.g. `/powehi-seo audit https://example.com`
    validations:
      required: true
  - type: textarea
    id: error-output
    attributes:
      label: Full error output
      description: >
        Copy the complete terminal output, with API keys, tokens, and private
        hostnames replaced by REDACTED.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
