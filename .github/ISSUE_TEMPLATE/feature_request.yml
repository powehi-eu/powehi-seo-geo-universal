name: Feature Request
description: Suggest a new feature or improvement for Powehi Universal SEO
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea? We'd love to hear it! For general discussion, consider using [GitHub Discussions](https://github.com/powehi-eu/powehi-seo-geo-universal/discussions) instead.

        > **Redact secrets before submitting.** Issues are public. Replace any
        > API key, token, `client_secret`, or private/staging hostname with
        > `REDACTED`. If a credential was already posted, revoke and rotate it
        > at the provider.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you'd like it to work
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered?
